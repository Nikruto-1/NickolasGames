name: Lighthouse performance baseline
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'NickolasGames/ClientApp/scripts/lighthouse-audit.mjs'
  push:
    branches: ['feature/lighthouse-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NickolasGames/ClientApp/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
        working-directory: NickolasGames/ClientApp
      - run: npm run build
        working-directory: NickolasGames/ClientApp
        env:
          NICKOLAS_REQUIRE_MEDIA_OPTIMIZATION: '1'
          NICKOLAS_PYTHON: python
      - name: Install Lighthouse
        run: npm install --prefix /tmp/ng-lighthouse --no-audit --no-fund lighthouse@13.0.1
      - name: Measure mobile and desktop routes
        working-directory: NickolasGames/ClientApp
        env:
          LIGHTHOUSE_CLI: /tmp/ng-lighthouse/node_modules/lighthouse/cli/index.js
        run: node scripts/lighthouse-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: NickolasGames/ClientApp/lighthouse-reports/
