
name: Deploy NickolasGames to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NickolasGames/ClientApp/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate ASP.NET Core API
        run: dotnet build NickolasGames/NickolasGames.csproj --configuration Release
      - name: Validate multiplayer session coordination
        run: dotnet run --project tests/SessionSmoke/SessionSmoke.csproj --configuration Release

      - name: Install dependencies
        working-directory: NickolasGames/ClientApp
        run: npm ci

      - name: Build React application
        working-directory: NickolasGames/ClientApp
        run: npm run build

      - name: Run complete automated test suite
        working-directory: NickolasGames/ClientApp
        run: npm test

      - name: Prepare system Chrome for responsive tests
        run: |
          npm install --prefix /tmp/nickolasgames-browser --no-audit --no-fund playwright-core@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$CHROME"
          echo "NICKOLAS_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "NICKOLAS_PLAYWRIGHT_PATH=/tmp/nickolasgames-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"

      - name: Test game screens in Chrome (mobile, tablet, desktop, zoom)
        working-directory: NickolasGames/ClientApp
        run: node scripts/browser-smoke.mjs

      - name: Keep previous assets for cached browser pages
        working-directory: NickolasGames/ClientApp
        run: node scripts/preserve-assets.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: NickolasGames/wwwroot

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
