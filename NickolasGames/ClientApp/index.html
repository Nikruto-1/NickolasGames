    <title>NickolasGames | Free Party Games With Friends</title>
    <style>
      html,body{margin:0;background:#f5f7fb;color:#172436}
      #app-startup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:36px 24px;box-sizing:border-box;font:16px/1.5 system-ui,sans-serif;text-align:center}
      #app-startup h1{margin:0;font-size:32px;letter-spacing:0}
      #app-startup p{margin:0;max-width:34ch}
      #app-startup-status{font-size:14px}
      .startup-state{display:grid;justify-items:center;gap:12px}
      .startup-mark{width:46px;height:46px;border-radius:50%;background:#155dcc;box-shadow:0 18px 42px #155dcc33;animation:startup-pulse 1.4s ease-in-out infinite}
      #app-startup button{font:inherit;color:#fff;background:#155dcc;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}
      #app-startup button[hidden]{display:none}
      .seo-content{max-width:60ch;font-size:15px;text-align:left}
      @keyframes startup-pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
    </style>
    <script>
      (function () {
        var copy = {
          uk: { loading: "Завантаження гри…", error: "Не вдалося завантажити гру. Перевір підключення та спробуй ще раз.", retry: "Спробувати ще раз" },
          en: { loading: "Loading the game…", error: "The game could not load. Check your connection and try again.", retry: "Try again" },
          sv: { loading: "Laddar spelet…", error: "Spelet kunde inte laddas. Kontrollera anslutningen och försök igen.", retry: "Försök igen" },
          de: { loading: "Spiel wird geladen…", error: "Das Spiel konnte nicht geladen werden. Prüfe die Verbindung und versuche es erneut.", retry: "Erneut versuchen" },
          es: { loading: "Cargando el juego…", error: "No se pudo cargar el juego. Comprueba la conexión e inténtalo de nuevo.", retry: "Intentar de nuevo" }
        };
        var lang = document.documentElement.lang || "en";
        try { if (location.pathname === "/") lang = localStorage.getItem("nickolasgames-lang") || lang; } catch (_) {}
        var text = copy[lang] || copy.en;
        var failed = false;
        function update() {
          var startup = document.getElementById("app-startup");
          if (!startup) return;
          document.getElementById("app-startup-status").textContent = failed ? text.error : text.loading;
          var retry = document.getElementById("app-startup-retry");
          retry.textContent = text.retry;
          retry.hidden = !failed;
          retry.onclick = function () {
            var url = new URL(location.href);
            url.searchParams.set("ng-refresh", Date.now().toString());
            location.replace(url.href);
          };
        }
        function fail() { failed = true; update(); }
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (event.error || (target && (target.tagName === "SCRIPT" || target.tagName === "LINK"))) fail();
        }, true);
        window.addEventListener("unhandledrejection", fail);
        document.addEventListener("DOMContentLoaded", update);
        setTimeout(function () {
          if (document.getElementById("app-startup")) fail();
        }, 15000);
      })();
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NickolasGames",
      "alternateName": "Nickolas Games",
      "url": "https://games.nickolasspace.com/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "isAccessibleForFree": true,
      "description": "Free browser-based party games for friends, teams and parties, including Who Am I, Charades, Alias and Truth or Dare. Play together on one phone with no download required.",
      "inLanguage": [
        "uk",
        "en",
        "de",
        "sv",
        "es"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "about": [
        {
          "@type": "Thing",
          "name": "Party games"
        },
        {
          "@type": "Thing",
          "name": "Group games"
        },
        {
          "@type": "Thing",
          "name": "Offline web games"
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "NickolasGames party games",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Who Am I?",
          "description": "Ask questions and guess the character on your hidden card."
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Charades",
          "description": "Show a word using gestures while the other players guess."
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Alias",
          "description": "Explain words to your friends without saying the word itself."
        },
        {
          "@type": "ListItem",
          "position": 4,
          "name": "Truth or Dare",
          "description": "Choose a question or a challenge for your group."
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <section id="app-startup" aria-label="NickolasGames">
        <div class="startup-mark" aria-hidden="true"></div>
        <h1>NickolasGames</h1>
        <div class="startup-state" data-nosnippet>
          <p id="app-startup-status" role="status">Preparing the games…</p>
          <button id="app-startup-retry" type="button" hidden>Try again</button>
        </div>
        <div class="seo-content">
          <h2>Free party games for friends, teams and parties</h2>
          <p>Play Who Am I?, Charades, Alias and Truth or Dare together on one phone. NickolasGames is available in Ukrainian, English, Swedish, German and Spanish.</p>
        </div>
        <noscript><p>Enable JavaScript in your browser to start the interactive games.</p></noscript>
      </section>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
